<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pepper Books – Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, #ff7e5f, #feb47b, #ffdc7d);
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .floating-book {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.45;
            animation: float 18s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0%   { transform: translateY(120vh) rotate(0deg); }
            100% { transform: translateY(-180vh) rotate(720deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.88);
            padding: 50px 35px;
            border-radius: 28px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.18);
            text-align: center;
            max-width: 820px;
            width: 100%;
            z-index: 10;
            animation: fadeIn 1.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.8rem;
            color: #e65100;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.1;
        }

        p {
            font-size: 1.35rem;
            margin: 14px 0;
            line-height: 1.6;
        }

        .contact-section {
            margin: 35px 0;
            font-size: 1.45rem;
        }

        .email {
            display: inline-block;
            font-weight: bold;
            background: linear-gradient(to right, #e65100, #ff8c00, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s;
        }

        .email:hover {
            transform: scale(1.05);
            text-shadow: 0 0 15px rgba(230,81,0,0.6);
        }

        .whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #25D366;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .whatsapp:hover {
            color: #128C7E;
            transform: translateY(-3px);
        }

        .whatsapp img {
            width: 38px;
            height: 38px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin: 40px 0;
        }

        .social-icons a {
            transition: all 0.4s ease;
        }

        .social-icons img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.35s;
        }

        .social-icons a:hover img {
            transform: translateY(-15px) scale(1.18);
            box-shadow: 0 20px 40px rgba(230,81,0,0.4);
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
                border-radius: 20px;
            }
            h1 {
                font-size: 2.8rem;
            }
            p {
                font-size: 1.2rem;
            }
            .contact-section {
                font-size: 1.3rem;
            }
            .social-icons img {
                width: 65px;
                height: 65px;
            }
            .floating-book {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            h1 {
                font-size: 2.4rem;
            }
            .social-icons {
                gap: 20px;
            }
            .social-icons img {
                width: 60px;
                height: 60px;
            }
            .whatsapp img {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating elements for dreamy effect -->
    <div class="floating-book" style="left:10%; animation-delay:0s;">📖</div>
    <div class="floating-book" style="left:35%; animation-delay:5s;">📚</div>
    <div class="floating-book" style="left:65%; animation-delay:9s;">🐯</div>
    <div class="floating-book" style="left:88%; animation-delay:14s;">🔥</div>

    <div class="container">
        <h1>Pepper Books is Roaring Back!</h1>
        <p>Upgrading for more stories, better experience, and pure magic.</p>
        <p>Follow us for updates & early peeks!</p>

        <div class="social-icons">
            <a href="https://www.facebook.com/pepperbooks" target="_blank" rel="noopener noreferrer">
                <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook">
            </a>
            <a href="https://twitter.com/pepperbooks" target="_blank" rel="noopener noreferrer">
                <img src="https://img.icons8.com/color/48/twitter--v1.png" alt="Twitter/X">
            </a>
            <a href="https://www.instagram.com/pepper_books" target="_blank" rel="noopener noreferrer">
                <img src="https://img.icons8.com/color/48/instagram-new.png" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/@pepperbooks" target="_blank" rel="noopener noreferrer">
                <img src="https://img.icons8.com/color/48/youtube-play.png" alt="YouTube">
            </a>
        </div>

        <div class="contact-section">
            <div class="email">pepperbook@yahoo.com</div>
            <br>
            <a href="https://wa.me/9920869482" class="whatsapp" target="_blank" rel="noopener noreferrer">
                <img src="https://img.icons8.com/color/48/whatsapp--v1.png" alt="WhatsApp">
                Message us on WhatsApp: +91 99208 69482
            </a>
        </div>
    </div>

</body>
</html>
