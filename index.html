<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pepper Books – Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ff9a00, #ffcc00);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px;
            color: #d35400;
            font-weight: bold;
        }
        .subheading {
            font-size: 24px;
            color: #e67e22;
            margin: 0 0 30px;
            font-weight: bold;
        }
        p {
            font-size: 20px;
            margin: 15px 0;
            line-height: 1.6;
        }
        .email {
            font-size: 22px;
            font-weight: bold;
            color: #e67e22;
            margin: 40px 0 20px;
        }
        .social-icons {
            margin-top: 20px;
        }
        .social-icons a {
            margin: 0 15px;
            display: inline-block;
        }
        .social-icons img {
            width: 50px;
            height: 50px;
            transition: transform 0.3s;
        }
        .social-icons img:hover {
            transform: scale(1.2);
        }
        img { /* For any other images if needed */
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 30px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pepper Books is roaring back.</h1>
        <div class="subheading">Join the Pack – Follow Us for Book Updates & Roars!</div>
        <p>Soon you will see more books with better search and cart options.</p>
        <p>We are roaring back stronger than ever.</p>
        <p>Stay tuned!</p>
        <div class="email">Contact us: pepperbook@yahoo.com</div>
        
        <!-- Social Media Icons -->
        <div class="social-icons">
            <a href="https://www.facebook.com/pepperbooks" target="_blank">
                <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook">
            </a>
            <a href="https://twitter.com/pepperbooks" target="_blank">
                <img src="https://img.icons8.com/color/48/twitter--v1.png" alt="Twitter/X">
            </a>
            <a href="https://www.instagram.com/pepper_books" target="_blank">
                <img src="https://img.icons8.com/color/48/instagram-new.png" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/@pepperbooks" target="_blank">
                <img src="https://img.icons8.com/color/48/youtube-play.png" alt="YouTube">
            </a>
        </div>
    </div>
</body>
</html>
