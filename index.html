<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pepper Books – Roaring Back Soon!</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff6b00, #ff8c00, #c300ff, #ff00aa);
            background-size: 400% 400%;
            animation: neonFlow 12s ease infinite;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @keyframes neonFlow {
            0%,100% { background-position: 0% 50%; }
            50%     { background-position: 100% 50%; }
        }
        .container {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            padding: 50px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 800px;
            box-shadow: 0 0 60px rgba(255,107,0,0.6);
            animation: pulseGlow 4s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 40px rgba(255,107,0,0.4); }
            to   { box-shadow: 0 0 80px rgba(195,0,255,0.7); }
        }
        h1 { 
            font-size: 4.5rem; 
            margin-bottom: 20px; 
            text-shadow: 0 0 20px #ff8c00;
            animation: textGlow 2.5s infinite alternate;
        }
        @keyframes textGlow {
            from { text-shadow: 0 0 10px #ff8c00; }
            to   { text-shadow: 0 0 30px #c300ff, 0 0 50px #ff00aa; }
        }
        p, .follow-prompt { font-size: 1.4rem; line-height: 1.6; margin: 15px 0; }
        .social-icons { display: flex; justify-content: center; gap: 35px; margin: 40px 0; }
        .social-icons img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            transition: all 0.4s;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .social-icons a:hover img { 
            transform: scale(1.25) rotate(10deg); 
            box-shadow: 0 0 35px #ff00aa;
        }
        @media (max-width: 600px) {
            h1 { font-size: 3.2rem; }
            .container { padding: 40px 25px; }
            .social-icons img { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pepper Books is Roaring Back! 🔥</h1>
        <p>While we're upgrading, follow us for exclusive sneak peeks!</p>
        <div class="follow-prompt">More books, better search, epic cart experience — coming soon!</div>
        
        <div class="social-icons">
            <a href="https://www.facebook.com/pepperbooks"><img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook"></a>
            <a href="https://twitter.com/pepperbooks"><img src="https://img.icons8.com/color/48/twitter--v1.png" alt="Twitter"></a>
            <a href="https://www.instagram.com/pepper_books"><img src="https://img.icons8.com/color/48/instagram-new.png" alt="Instagram"></a>
            <a href="https://www.youtube.com/@pepperbooks"><img src="https://img.icons8.com/color/48/youtube-play.png" alt="YouTube"></a>
        </div>
        
        <p>Contact: pepperbook@yahoo.com</p>
    </div>
</body>
</html>
